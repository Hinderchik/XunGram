name: CI

on:
  push:
    branches: [dev]
  pull_request:
    branches: [dev]
  workflow_dispatch:

jobs:
  sdk-tests:
    name: Python SDK Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: pip install pytest
      - name: Run SDK tests
        run: python -m pytest -q sdk/tests

  linux-build:
    name: Linux x86_64 Build
    runs-on: ubuntu-latest
    timeout-minutes: 360
    env:
      CCACHE_DIR: ${{ runner.temp }}/.ccache
      CMAKE_BUILD_PARALLEL_LEVEL: 4
    steps:
      - name: Free disk space
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: false
          docker-images: false
          swap-storage: false

      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Generate Dockerfile
        run: |
          python3 -m pip install Jinja2
          cd Telegram/build/docker/centos_env
          DEBUG= LTO= python3 gen_dockerfile.py > Dockerfile.generated

      - name: Cache Docker image
        id: docker-cache
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/docker-image-cache
          key: docker-centos-env-${{ hashFiles('Telegram/build/docker/centos_env/Dockerfile') }}

      - name: Load Docker cache (if available)
        if: steps.docker-cache.outputs.cache-hit == 'true'
        run: docker load -i ${{ runner.temp }}/docker-image-cache/image.tar

      - name: Build libraries image
        if: steps.docker-cache.outputs.cache-hit != 'true'
        uses: docker/build-push-action@v6
        with:
          context: Telegram/build/docker/centos_env
          file: Telegram/build/docker/centos_env/Dockerfile.generated
          tags: tdesktop:centos_env
          load: true
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Save Docker cache
        if: steps.docker-cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p ${{ runner.temp }}/docker-image-cache
          docker save tdesktop:centos_env > ${{ runner.temp }}/docker-image-cache/image.tar

      - name: Build Telegram
        run: |
          docker run --rm \
            -u $(id -u) \
            -v $PWD:/usr/src/tdesktop \
            -v ${{ env.CCACHE_DIR }}:/var/cache/ccache \
            -e CONFIG=Debug \
            -e CCACHE_COMPRESS=1 \
            -e CCACHE_MAXSIZE=2G \
            -e CMAKE_BUILD_PARALLEL_LEVEL=4 \
            tdesktop:centos_env \
            /usr/src/tdesktop/Telegram/build/docker/centos_env/build.sh \
            -D CMAKE_CONFIGURATION_TYPES=Debug \
            -D TDESKTOP_API_TEST=ON \
            -D CMAKE_C_FLAGS_DEBUG="-O0" \
            -D CMAKE_CXX_FLAGS_DEBUG="-O0" \
            -D CMAKE_COMPILE_WARNING_AS_ERROR=OFF

      - name: Check artifact
        run: |
          test -x out/Debug/Telegram || (ls -la out/Debug/ || true; exit 1)

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: Telegram-Linux-Debug
          path: out/Debug/{Telegram,Updater}
          if-no-files-found: error
          retention-days: 7
