name: CI

on:
  push:
    branches: [dev]
  pull_request:
    branches: [dev]
  workflow_dispatch:

jobs:
  sdk-tests:
    name: Python SDK Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: pip install pytest
      - name: Run SDK tests
        run: python -m pytest -q sdk/tests

  linux-build:
    name: Linux x86_64 Build
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Free disk space
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: false
          docker-images: false
          swap-storage: false

      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Generate Dockerfile
        run: |
          python3 -m pip install Jinja2
          cd Telegram/build/docker/centos_env
          DEBUG= LTO= python3 gen_dockerfile.py > Dockerfile.generated

      - name: Cache ccache
        id: ccache-cache
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/.ccache
          key: ${{ runner.os }}-ccache-${{ hashFiles('Telegram/SourceFiles/**/*.cpp', 'Telegram/SourceFiles/**/*.h', 'Telegram/CMakeLists.txt', 'Telegram/lib_*/CMakeLists.txt', 'cmake/**/*.cmake') }}
          restore-keys: |
            ${{ runner.os }}-ccache-

      - name: Build libraries image
        uses: docker/build-push-action@v6
        with:
          context: Telegram/build/docker/centos_env
          file: Telegram/build/docker/centos_env/Dockerfile.generated
          tags: tdesktop:centos_env
          load: true

      - name: Build Telegram
        run: |
          docker run --rm -u root \
            -v $PWD:/usr/src/tdesktop \
            -v ${{ github.workspace }}/.ccache:/var/cache/ccache \
            -e CONFIG=Release \
            -e CCACHE_DIR=/var/cache/ccache \
            -e CCACHE_COMPRESS=1 \
            -e CCACHE_MAXSIZE=2G \
            -e CMAKE_BUILD_PARALLEL_LEVEL=6 \
            -e TDESKTOP_API_ID=33927119 \
            -e TDESKTOP_API_HASH=44f7cf061c898a0c6e06f13b03f7b462 \
            tdesktop:centos_env \
            /usr/src/tdesktop/Telegram/build/docker/centos_env/build.sh \
            -D CMAKE_CONFIGURATION_TYPES=Release \
            -D TDESKTOP_API_TEST=ON \
            -D CMAKE_COMPILE_WARNING_AS_ERROR=OFF \
            -D CMAKE_C_FLAGS_RELEASE="-O2" \
            -D CMAKE_CXX_FLAGS_RELEASE="-O2"

      - name: Check artifact
        run: |
          test -x out/Release/Telegram || (ls -la out/Release/ || true; exit 1)

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: Telegram-Linux-Release
          path: out/Release/
          if-no-files-found: error
          retention-days: 7